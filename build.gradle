plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	maven {
		name = 'GeckoLib'
		url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
		content { includeGroup "com.terraformersmc" }
	}
	maven {
		name = 'Shedaniel'
		url = 'https://maven.shedaniel.me/'
		content { includeGroup "me.shedaniel.cloth" }
	}
}

dependencies {

	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.0"
	testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.0"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.0"
	modImplementation "maven.modrinth:geckolib:${project.geckolib_version_id}"

	modImplementation "maven.modrinth:modonomicon:${project.modonomicon_version_id}"
	modLocalRuntime "me.zeroeightsix:fiber:0.23.0-2"
	runtimeOnly "org.commonmark:commonmark:0.22.0"
	runtimeOnly "org.commonmark:commonmark-ext-gfm-strikethrough:0.22.0"
	runtimeOnly "org.commonmark:commonmark-ext-ins:0.22.0"

	modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
	modLocalRuntime "maven.modrinth:vics-point-blank:96kcubpx"
	modImplementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude group: "net.fabricmc.fabric-api"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

tasks.named("runClient", JavaExec).configure {
	if (System.getProperty("os.name", "").toLowerCase(java.util.Locale.ROOT).contains("windows")) {

		jvmArgs "-Doshi.util.wmi.timeout=5000"
	}
	doFirst {
		def wanted = "Icy"
		def offline = java.util.UUID.nameUUIDFromBytes(
				("OfflinePlayer:" + wanted).getBytes(java.nio.charset.StandardCharsets.UTF_8))
		def out = new ArrayList<String>(args)
		def force = { String flag, String value ->
			int at = out.indexOf(flag)
			if (at >= 0 && at + 1 < out.size()) {
				out.set(at + 1, value)
			} else {
				out.add(flag)
				out.add(value)
			}
		}
		force("--username", wanted)
		force("--uuid", offline.toString().replace("-", ""))
		args = out
	}
}

test {
	useJUnitPlatform()
}

java {

	withSourcesJar()

	toolchain.languageVersion = JavaLanguageVersion.of(21)
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {

	}
}
