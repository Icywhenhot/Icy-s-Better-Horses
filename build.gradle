plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	maven {
		name = 'GeckoLib'
		url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
	}
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
		content {
			includeGroup 'com.terraformersmc'
		}
	}
	maven {
		name = 'Shedaniel'
		url = 'https://maven.shedaniel.me/'
		content {
			includeGroup 'me.shedaniel.cloth'
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"icys-better-horses" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modImplementation "software.bernie.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"

	// Mod Menu + Cloth Config — optional in-game config editor. Present in dev so runClient shows
	// the config screen; not bundled into the shipped jar (players install them to get the screen).
	modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
	modImplementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}

	// Patchouli — optional integration. Present only in the dev runtime so the Stable Handbook
	// book loads when you launch runClient; it is NOT a compile dependency (the book is fully
	// data-driven) and is NOT bundled into the shipped jar. Players install Patchouli themselves.
	modLocalRuntime "maven.modrinth:patchouli:${project.patchouli_version}"

	// Patchouli's config library. It ships inside Patchouli as a jar-in-jar, but loom does not add
	// that nested jar to the dev runtime classpath for modLocalRuntime deps, so the dev launch
	// crashes with NoClassDefFoundError on fiber's ConfigType. Vendor it from the bundled copy and
	// add it directly. Dev-only, like Patchouli itself — never shipped (players get it via JiJ).
	modLocalRuntime files("libs/fiber-0.23.0-2.jar")

	testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.0"
	testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.0"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.0"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

tasks.named("runClient").configure {
	doFirst {
		def modsDir = file("run/mods")
		def processedModsDir = file("run/.fabric/processedMods")
		def hasPatchouliJar = modsDir.exists() && modsDir.listFiles()?.any { file ->
			file.name ==~ /(?i)patchouli-.*\.jar/
		}

		if (!hasPatchouliJar && processedModsDir.exists()) {
			def stalePatchouliMods = processedModsDir.listFiles()?.findAll { file ->
				file.name ==~ /(?i)(patchouli|fiber)-.*\.jar/
			} ?: []

			stalePatchouliMods.each { file ->
				logger.lifecycle("Removing stale dev Patchouli cache: ${file.name}")
				file.delete()
			}
		}
	}
}

test {
	useJUnitPlatform()
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
