plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_archive_name
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    maven {
        name = 'Klikli'
        url = 'https://dl.cloudsmith.io/public/klikli-dev/mods/maven/'
        content { includeGroup 'com.klikli_dev' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'GeckoLib'
                url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            }
        }
        filter {
            includeGroupAndSubgroups 'com.geckolib'
            includeGroupAndSubgroups 'software.bernie.geckolib'
        }
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
        content { includeGroup 'me.shedaniel.cloth' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'CurseMaven'
                url = 'https://cursemaven.com'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
    mavenCentral()
}

repositories.configureEach {
    if (it instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository && it.name == 'NeoForged Releases') {
        it.content {
            includeGroupByRegex 'cpw\\.mods(\\..+)?'
            includeGroupByRegex 'de\\.oceanlabs\\.mcp(\\..+)?'
            includeGroupByRegex 'net\\.minecraftforge(\\..+)?'
            includeGroupByRegex 'net\\.neoforged(\\..+)?'
            includeGroup 'org.parchmentmc.data'
            includeGroupByRegex 'org\\.parchmentmc(\\..+)?'
        }
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    implementation "com.klikli_dev:modonomicon-${minecraft_version}-neoforge:${modonomicon_version}"
    implementation "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"

    localRuntime "maven.modrinth:trotting-wagons:mpGWRAjg"
    localRuntime "maven.modrinth:farmers-delight:XTVZDOol"
    localRuntime "maven.modrinth:quark:8uDGRJCr"
    localRuntime "maven.modrinth:zeta:9GjNW2Gf"
    localRuntime "maven.modrinth:biolith:EAjbdreT"
    compileOnly "maven.modrinth:curios:yohfFbgD"
    localRuntime "maven.modrinth:curios:yohfFbgD"

    localRuntime "maven.modrinth:tooltip-overhaul:aclR21OH"
    localRuntime "maven.modrinth:blueprint:FHOjk8Ez"
    localRuntime "maven.modrinth:unusual_end:oV8w25It"
    localRuntime "maven.modrinth:galosphere:IgULrnXA"
    localRuntime "curse.maven:caverns-and-chasms-438005:8891838"
    localRuntime "maven.modrinth:architectury-api:1IiqEQGl"
    localRuntime "maven.modrinth:epic-knights-shields-armor-and-weapons:DDOFBcvu"
    localRuntime "curse.maven:codechicken-lib-242818:8491811"
    localRuntime "curse.maven:ender-storage-245174:6159037"
    compileOnly "maven.modrinth:minecraft-comes-alive-reborn:S2Ln2tIn"
    localRuntime "maven.modrinth:stoneycore:FpZHKl6Y"
    localRuntime "maven.modrinth:kingdoms-sieges:8oYP0xED"

    testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.0"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.0"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.0"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            geckolib_version       : geckolib_version,
            modonomicon_version    : modonomicon_version,
            cloth_config_version   : cloth_config_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '300'])
}

test {
    useJUnitPlatform()
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName

    from("LICENSE") {
        rename { "${it}_$projectName" }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
