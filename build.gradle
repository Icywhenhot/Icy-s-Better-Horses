plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.mod_archive_name
}

repositories {
	maven {
		name = 'GeckoLib'
		url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
		content {
			includeGroupAndSubgroups 'software.bernie.geckolib'
			includeGroupAndSubgroups 'com.eliotlash.mclib'
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter { includeGroup 'maven.modrinth' }
	}
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
		content { includeGroup 'com.terraformersmc' }
	}
	maven {
		name = 'Shedaniel'
		url = 'https://maven.shedaniel.me/'
		content { includeGroup 'me.shedaniel.cloth' }
	}
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modImplementation "software.bernie.geckolib:geckolib-fabric-1.20.1:${project.geckolib_version}"
	modImplementation "maven.modrinth:patchouli:${project.patchouli_version}"
	modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
	modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude group: "net.fabricmc.fabric-api"
	}

	implementation "com.google.code.gson:gson:2.10.1"
	compileOnly "org.jetbrains:annotations:26.0.2"

	testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.0"
	testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.0"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.0"
}

// Dev only: Loom doesn't unpack Patchouli's nested Fiber jar, so runClient crashes without it.
// Pulls it out of Patchouli's own jar. Doesn't touch the published jar; delete if Loom fixes this.
configurations {
	// Patchouli's raw jar, only used to extract Fiber from.
	patchouliBundle {
		canBeConsumed = false
		transitive = false
	}
}

dependencies {
	patchouliBundle "maven.modrinth:patchouli:${project.patchouli_version}"
}

def patchouliFiberDir = layout.buildDirectory.dir('patchouliFiber')

// Resolved lazily, so builds that never run the game skip it.
def extractPatchouliFiber = tasks.register('extractPatchouliFiber', Copy) {
	from { zipTree(configurations.patchouliBundle.singleFile) }
	include 'META-INF/jars/fiber-*.jar'
	includeEmptyDirs = false
	eachFile { fcd -> fcd.path = fcd.name }
	into patchouliFiberDir
}

dependencies {
	// builtBy makes the run tasks extract Fiber first.
	modLocalRuntime fileTree(patchouliFiberDir.get().asFile) {
		include '*.jar'
	}.builtBy(extractPatchouliFiber)
}

processResources {
	def replaceProperties = [
			version        : project.mod_version,
			mod_name       : project.mod_name,
			mod_license    : project.mod_license,
			mod_authors    : project.mod_authors,
			mod_description: project.mod_description,
	]
	inputs.properties replaceProperties
	filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
		expand replaceProperties
	}
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 17
}

test {
	useJUnitPlatform()
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName
	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {}
}
