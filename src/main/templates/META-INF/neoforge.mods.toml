license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="assets/icys-better-horses/icon.png"
description='''
Turns horses from an early-game novelty into long-term companions: ownership and bonding, fifteen breeds with their own coats and biomes, dedicated tack, carts, and a stack of riding improvements.
'''

[[mixins]]
config="icys-better-horses.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="geckolib"
type="required"
versionRange="[${geckolib_version},)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="modonomicon"
type="required"
versionRange="[${modonomicon_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="cloth_config"
type="optional"
versionRange="[${cloth_config_version},)"
ordering="NONE"
side="CLIENT"
