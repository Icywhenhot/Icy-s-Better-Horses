title: Icy's Better Horses
description: >-
  Wiki for Icy's Better Horses — a Fabric mod that turns horses into long-term
  companions with ownership, bonding, fifteen breeds, dedicated tack, and carts.

url: https://icywhenhot.github.io
baseurl: /Icy-s-Better-Horses

theme: just-the-docs

defaults:
  - scope:
      path: ""
    values:
      layout: default

nav_external_links:
  - title: Source on GitHub
    url: https://github.com/Icywhenhot/Icy-s-Better-Horses
    hide_icon: false

aux_links:
  GitHub: https://github.com/Icywhenhot/Icy-s-Better-Horses
aux_links_new_tab: true

color_scheme: bh
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

heading_anchors: true

back_to_top: true
back_to_top_text: "Back to top"

footer_content: >-
  Icy's Better Horses is All Rights Reserved. Documentation generated from the
  mod source and the in-game Stable Handbook.
last_edit_timestamp: true
last_edit_time_format: "%b %e %Y"

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: https://github.com/Icywhenhot/Icy-s-Better-Horses
gh_edit_branch: "26.2-fab"
gh_edit_source: docs
gh_edit_view_mode: "tree"

callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  warning:
    title: Heads up
    color: yellow
  version:
    title: Version
    color: purple

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .jekyll-cache/
  - _site/

  - horse-stabilizer-model-guide.md
  - horse-ui-art-guide.md

plugins:
  - jekyll-seo-tag
  - jekyll-include-cache
